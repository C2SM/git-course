name: Shellcheck

# The exercises lean on several shell scripts to bootstrap sandboxes and self-test.
# A bug in one of them breaks the course for everyone following it, so lint them like
# the code they are.

on:
  pull_request:
    paths:
      - "**.sh"
      - ".github/workflows/shellcheck.yml"

  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          # beginner/helpers.sh predates this workflow and is not part of this task's
          # scope; it has its own pre-existing style warnings (unquoted variables,
          # unchecked cd) that are a separate cleanup, not a regression to gate on here.
          # A trailing single file cannot be excluded by name alone: the action's find
          # walks from scandir "." and only matches "./beginner/helpers.sh" verbatim.
          ignore_paths: ./beginner/helpers.sh
