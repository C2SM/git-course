name: Build Marp Slides PDF

on:
  pull_request:
    paths:
      - "advanced/slides/**"
      - "slides_theme/**"
      - ".github/workflows/build_advanced_slides.yml"
      - "!advanced/slides/slides_advanced.pdf"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-advanced-slides-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build diagrams and PDF
        # Same script authors run locally, so the committed PDF cannot drift.
        run: ./advanced/slides/build.sh

      - name: Commit updated diagrams and PDF to PR branch
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          git add advanced/slides/images advanced/slides/slides_advanced.pdf
          if git diff --cached --quiet; then
            echo "Diagrams and PDF are already up to date."
          else
            # [skip ci] stops GitHub from queuing new workflow runs for this commit,
            # so fork PRs don't need a fresh manual approval after every auto-push.
            git commit -m "Update advanced slides diagrams and PDF [skip ci]"

            # The sibling beginner-slides workflow can push to this same branch at
            # the same time (both trigger on shared slides_theme/** changes), so
            # retry with a rebase if another push landed first.
            for attempt in 1 2 3 4 5; do
              git push origin HEAD:${{ github.head_ref }} && break
              [[ $attempt -eq 5 ]] && { echo "::error::Push failed after $attempt attempts"; exit 1; }
              echo "Push rejected, rebasing onto latest and retrying..."
              git fetch origin ${{ github.head_ref }}
              git rebase FETCH_HEAD
            done
          fi
