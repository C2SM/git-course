name: Build Marp Slides PDF

on:
  push:
    paths:
      - "advanced/slides/**"
      - "slides_template/**"
      - ".github/workflows/build_advanced_slides.yml"
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build PDF
        run: |
          npx @marp-team/marp-cli@latest advanced/slides/slides.md \
            --theme slides_template/c2sm.css \
            --pdf \
            --allow-local-files \
            -o advanced/slides/slides_advanced.pdf

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: marp-slides-pdf
          path: advanced/slides/slides_advanced.pdf